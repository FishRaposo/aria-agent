name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the dev extra from uv.lock
        # --locked fails if uv.lock no longer matches pyproject.toml.
        run: |
          uv sync --locked --extra dev --python 3.11
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Test
        run: pytest -q
      - name: Focused skills test
        run: pytest --noconftest tests/test_skills.py -q
      - name: Ruff
        run: |
          ruff check src/aria tests examples scripts
          ruff format --check src/aria tests examples scripts
      - name: Pyright
        run: pyright src/
      - name: Forbidden dependency scan
        run: python scripts/check_forbidden_dependencies.py
      - name: Offline evidence
        run: make evidence
      - name: Wheel contents
        run: make package
      - name: Isolated wheel import
        # Runtime dependencies come from uv.lock (hash-checked); the wheel adds none.
        run: |
          uv export --locked --quiet --no-emit-project --format requirements-txt -o /tmp/aria-runtime.txt
          python -m venv /tmp/aria-wheel
          /tmp/aria-wheel/bin/python -m pip install --upgrade pip
          /tmp/aria-wheel/bin/python -m pip install --require-hashes -r /tmp/aria-runtime.txt
          /tmp/aria-wheel/bin/python -m pip install --no-deps dist/*.whl
          /tmp/aria-wheel/bin/python -m pip check
          /tmp/aria-wheel/bin/python -c "import aria, aria.main, aria.config, aria.db, aria.tracing, aria.internal.vendor_core.pricing"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # vitest 5 / vite 8 require Node >=22.12; Next 16 needs >=20.9.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
      - name: Connected outage browser checks
        run: npm run test:e2e:connected -- --project=chromium
      - name: Production demo browser checks
        run: npm run test:e2e:prod -- --project=chromium
