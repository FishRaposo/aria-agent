name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the declared project extra
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Focused skills test
        run: pytest --noconftest tests/test_skills.py -q
      - name: Ruff
        run: |
          ruff check src/aria tests examples scripts
          ruff format --check src/aria tests examples scripts
      - name: Pyright
        run: pyright src/
      - name: Forbidden dependency scan
        run: python scripts/check_forbidden_dependencies.py
      - name: Offline evidence
        run: make evidence
      - name: Wheel contents
        run: make package
      - name: Isolated wheel import
        run: |
          python -m venv /tmp/aria-wheel
          /tmp/aria-wheel/bin/python -m pip install --upgrade pip
          /tmp/aria-wheel/bin/python -m pip install dist/*.whl
          /tmp/aria-wheel/bin/python -c "import aria, aria.main, aria.config, aria.db, aria.tracing, aria.internal.vendor_core.pricing"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
