version: '3.8'

services:
  aria-postgres:
    image: pgvector/pgvector:pg16
    container_name: aria_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - aria_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  aria-redis:
    image: redis:7-alpine
    container_name: aria_redis
    ports:
      - "6379:6379"
    volumes:
      - aria_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  aria-web:
    build:
      context: ./frontend
      target: dev
    container_name: aria_web
    ports:
      - "3000:3000"
    environment:
      # In-cluster the dashboard would call the API; from the browser it must
      # use a host-reachable URL, so this points at the host-mapped API port.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  aria_pgdata:
  aria_redisdata:
